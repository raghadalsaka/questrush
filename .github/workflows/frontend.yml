name: Frontend

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", samples/**, .github/workflows/deploy-pages.yml]
  pull_request:
    paths-ignore: ["**.md", samples/**, .github/workflows/deploy-pages.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build
