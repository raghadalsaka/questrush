name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", apps-script/**, samples/**, .github/workflows/frontend.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          # Repository variables: the API's public URL, and the site's base path ("/" on a custom domain, "/<repo>/" otherwise).
          VITE_API_BASE_URL: ${{ vars.QUESTRUSH_API_BASE_URL }}
          # Set these three instead of QUESTRUSH_API_BASE_URL to use the Google Sheet backend (apps-script/README.md).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.QUESTRUSH_GOOGLE_CLIENT_ID }}
          VITE_SHEET_ID: ${{ vars.QUESTRUSH_SHEET_ID }}
          VITE_SHEET_API_URL: ${{ vars.QUESTRUSH_SHEET_API_URL }}
          VITE_BASE: ${{ vars.QUESTRUSH_BASE_PATH || '/' }}
        run: npx vite build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
