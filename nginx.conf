server {
    listen 80;
    root /usr/share/nginx/html;

    # Stage files and game settings unlock levels when edited, so browsers must revalidate them.
    location ~ ^/(stages/[^/]+\.json|game\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
