server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API for the compose setup; the API container is never exposed to the browser directly.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 4m;
    }

    # Stage files and game settings unlock levels when edited, so browsers must revalidate them.
    location ~ ^/(stages/[^/]+\.json|game\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
